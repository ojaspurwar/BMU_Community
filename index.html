<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='tricolor' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%232563eb'/><stop offset='50%' stop-color='%2310b981'/><stop offset='100%' stop-color='%23ef4444'/></linearGradient></defs><rect width='100' height='100' rx='28' fill='url(%23tricolor)'/><text x='50%' y='67%' font-family='system-ui, sans-serif' font-size='52' font-weight='900' fill='white' text-anchor='middle'>B</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusPulse • BML Munjal University Operating System</title>
    <meta
      name="description"
      content="A unified real-time campus OS for student events, peer skill & gear trading, live study spot radar, and verified campus announcements at BMU."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&family=Inter:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/globals.css?v=0.5.0" />
  </head>
  <body class="min-h-[100dvh] bg-[#080c14] text-slate-100 antialiased selection:bg-teal-500 selection:text-slate-950 overflow-x-hidden">
    <div id="root">
      <!-- Loading Shell with Teal, Coral, Blue theme while ESM modules bootstrap -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #080c14; color: #f8fafc; font-family: 'DM Sans', system-ui, sans-serif;">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #14b8a6, #38bdf8, #f97316); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; color: #080c14; box-shadow: 0 0 35px rgba(20, 184, 166, 0.4); margin-bottom: 16px;">
          CP
        </div>
        <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; font-family: 'Space Grotesk', sans-serif;">
          Campus<span style="color: #2dd4bf;">Pulse</span>
        </div>
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 20px; display: flex; align-items: center; gap: 6px;">
          <span style="color: #14b8a6; font-weight: 700;">BMU</span> OS • <span style="color: #38bdf8; font-weight: 700;">Live</span> Telemetry
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b;">
          <div style="width: 7px; height: 7px; border-radius: 50%; background: #14b8a6; animation: pulse 1.5s infinite;"></div>
          Bootstrapping real-time campus telemetry...
        </div>
      </div>
    </div>

    <script>
      function showBootError(msg) {
        console.error('Initialization Error:', msg);
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 40px; color: #f87171; font-family: monospace; max-width: 800px; margin: 40px auto; background: #0e1422; border: 1px solid #f43f5e; border-radius: 16px;">' +
            '<h2 style="font-size: 20px; margin-bottom: 12px; color: #fff;">Runtime Initialization Notice</h2>' +
            '<p style="color: #fca5a5; font-size: 14px; margin-bottom: 16px;">' + msg + '</p>' +
            '<button onclick="localStorage.clear(); sessionStorage.clear(); location.reload();" style="background: #14b8a6; color: #042f2e; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-right: 12px;">Reset Storage & Reload</button>' +
            '<button onclick="location.reload();" style="background: #1e293b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Normal Reload</button>' +
            '</div>';
        }
      }

      window.addEventListener('error', function(e) {
        showBootError(e.error ? (e.error.stack || e.error.message) : (e.message || 'Script evaluation error'));
      });

      window.addEventListener('unhandledrejection', function(e) {
        showBootError(e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unhandled Promise Rejection');
      });
    </script>
    <script type="module" src="/src/main.tsx?v=0.5.0"></script>
  </body>
</html>
