<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='tricolor' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%232563eb'/><stop offset='50%' stop-color='%2310b981'/><stop offset='100%' stop-color='%23ef4444'/></linearGradient></defs><rect width='100' height='100' rx='28' fill='url(%23tricolor)'/><text x='50%' y='67%' font-family='system-ui, sans-serif' font-size='52' font-weight='900' fill='white' text-anchor='middle'>B</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusPulse • BML Munjal University Operating System</title>
    <meta
      name="description"
      content="A unified real-time campus OS for student events, peer skill & gear trading, live study spot radar, and verified campus announcements at BMU."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/globals.css" />
  </head>
  <body class="min-h-screen bg-[#06090e] text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <!-- Loading Shell with Green, Red, Blue theme while ESM modules bootstrap -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #06090e; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif;">
        <div style="width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, #2563eb, #10b981, #ef4444); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 30px; color: #fff; box-shadow: 0 0 35px rgba(37, 99, 235, 0.4); margin-bottom: 20px;">
          B
        </div>
        <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px;">
          Campus<span style="color: #38bdf8;">Pulse</span>
        </div>
        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 24px; display: flex; align-items: center; gap: 6px;">
          <span style="color: #10b981; font-weight: 700;">BMU</span> OS • <span style="color: #ef4444; font-weight: 700;">Live</span> Telemetry
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 1.5s infinite;"></div>
          Bootstrapping real-time multi-tab telemetry...
        </div>
      </div>
    </div>

    <script>
      window.addEventListener('error', function(e) {
        console.error('Global Error caught:', e.error || e.message);
        var root = document.getElementById('root');
        if (root && root.innerHTML.includes('Bootstrapping')) {
          root.innerHTML = '<div style="padding: 40px; color: #f87171; font-family: monospace; max-width: 800px; margin: 40px auto; background: #0b1329; border: 1px solid #ef4444; border-radius: 16px;">' +
            '<h2 style="font-size: 20px; margin-bottom: 12px; color: #fff;">Runtime Initialization Notice</h2>' +
            '<p style="color: #fca5a5; font-size: 14px; margin-bottom: 16px;">' + (e.message || 'Unknown error during script evaluation') + '</p>' +
            '<button onclick="location.reload()" style="background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Reload CampusPulse</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
